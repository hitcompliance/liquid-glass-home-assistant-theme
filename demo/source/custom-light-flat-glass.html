<style>
#custom-light-preview{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f2f4f7;color-scheme:dark}
#custom-light-preview *{box-sizing:border-box}
#custom-light-preview .preview{padding:38px 24px;background:radial-gradient(ellipse at 15% 0,#353b3d,transparent 60%),#131719;border-radius:22px;display:grid;gap:18px}
#custom-light-preview .light-card{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(145deg,#ffffff05,transparent 40%),#111518eb;border-radius:18px;border:1px solid #ffffff23;padding:12px 14px 15px;box-shadow:inset 0 1px 0 #ffffff24,inset 0 -1px 0 #ffffff0b,0 7px 15px #00000020;backdrop-filter:blur(22px);--light:#ab72ff;--level:.72}
#custom-light-preview .uplight{position:absolute;inset:10% 0 -12%;z-index:-1;background-color:var(--light);mask-image:radial-gradient(ellipse 75% 58% at 50% 110%,#000,transparent 90%);opacity:calc(var(--level)*.42);pointer-events:none;transition:background-color .4s,opacity .55s}
#custom-light-preview .light-card:after{content:"";position:absolute;bottom:0;left:18%;right:18%;height:1px;background:var(--light);opacity:var(--level);box-shadow:0 -2px 12px var(--light);transition:background-color .4s,opacity .55s}
#custom-light-preview .head{display:flex;align-items:center;gap:13px;min-height:66px}
#custom-light-preview .name{font-size:17px;line-height:22px;font-weight:500}
#custom-light-preview .status{font-size:12px;line-height:18px;color:#b0b7be;margin-top:2px;font-variant-numeric:tabular-nums}
#custom-light-preview .switch{width:112px;height:66px;flex:none;position:relative;padding:0;background:none;border:0;isolation:isolate;touch-action:manipulation;color:#f3f7ff;-webkit-tap-highlight-color:transparent}
#custom-light-preview .track{position:absolute;left:0;right:0;top:15px;height:36px;border-radius:30px;border:1px solid #ffffff24;background:linear-gradient(#ffffff0d,transparent),#242a2d;box-shadow:inset 0 1px 2px #ffffff15,inset 0 -2px 3px #00000030;overflow:hidden}
#custom-light-preview .track-light{position:absolute;inset:0;background-color:var(--light);opacity:calc(var(--level)*.45);transition:background-color .4s,opacity .45s}
#custom-light-preview .track-value{position:absolute;left:0;width:56px;top:24px;font-size:12px;font-variant-numeric:tabular-nums;line-height:18px;transition:transform .6s cubic-bezier(.2,1.2,.35,1)}
#custom-light-preview .switch[aria-checked="false"] .track-value{transform:translateX(56px)}
#custom-light-preview .knob-position{position:absolute;top:5px;left:0;width:56px;height:56px;transform:translateX(56px);transition:transform .67s cubic-bezier(.2,1.22,.34,1);pointer-events:none}
#custom-light-preview .switch[aria-checked="false"] .knob-position{transform:translateX(0)}
#custom-light-preview .knob{position:absolute;inset:0;border-radius:50%;border:1px solid #ffffff59;background:radial-gradient(ellipse at 34% 5%,#ffffff45,transparent 42%),linear-gradient(135deg,#e0ebf32b,#111a201c 50%,#e0ebf31f);box-shadow:inset 1px 1px 2px #ffffff24,inset -1px -2px 3px #ffffff30,0 4px 9px #00000030;backdrop-filter:blur(6px) saturate(140%);transition:transform .45s cubic-bezier(.17,1.65,.4,1);overflow:hidden;display:grid;place-items:center}
#custom-light-preview .knob:before{content:"";position:absolute;inset:0;background-color:var(--light);opacity:calc(var(--level)*.36);transition:background-color .4s,opacity .45s}
#custom-light-preview .knob:after{content:"";position:absolute;inset:3px;border-radius:50%;border-top:1px solid #ffffff60;border-bottom:1px solid #ffffff45;pointer-events:none}
#custom-light-preview .knob svg{width:25px;height:25px;position:relative;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--light) 50%,transparent))}
#custom-light-preview .knob .socket{fill:currentColor;stroke:none}
#custom-light-preview .switch:hover .knob{transform:scale(1.1)}
#custom-light-preview .switch.pressing .knob{transform:scale(1.17,.79);transition:transform 85ms ease-out}
#custom-light-preview .switch.travelling .knob{animation:elastic-knob .65s both}
@keyframes elastic-knob{0%{transform:scale(1.17,.79)}35%{transform:scale(.91,1.1)}67%{transform:scale(1.07,.97)}100%{transform:scale(1)}}
#custom-light-preview .controls{display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:9px;margin-top:8px;align-items:center}
#custom-light-preview input[type="range"]{appearance:none;-webkit-appearance:none;width:100%;height:46px;border-radius:12px;border:1px solid #ffffff16;background:var(--slider);box-shadow:inset 0 2px 4px #00000038;margin:0;touch-action:pan-y;transition:opacity .4s}
#custom-light-preview .light-card[data-on="false"] input[type="range"]{opacity:.5}
#custom-light-preview input[type="range"]::-webkit-slider-runnable-track{height:44px;background:transparent}
#custom-light-preview input[type="range"]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:19px;height:42px;margin-top:1px;border-radius:9px;border:1px solid #ffffff8c;background:#ffffff36;box-shadow:inset 0 1px 1px #ffffff60,0 1px 5px #00000030}
#custom-light-preview input[type="range"]::-moz-range-thumb{width:17px;height:40px;border-radius:9px;border:1px solid #ffffff8c;background:#ffffff36}
#custom-light-preview .modes{display:flex;height:46px;background:#ffffff05;border:1px solid #ffffff17;border-radius:12px;overflow:hidden}
#custom-light-preview .mode{width:44px;border:0;color:#abb4bc;background:transparent;display:grid;place-items:center;padding:0;touch-action:manipulation}
#custom-light-preview .mode+button{border-left:1px solid #ffffff0d}
#custom-light-preview .mode[aria-pressed="true"]{color:#f5f8ff;background:#ffffff14;box-shadow:inset 0 1px 0 #ffffff1b}
#custom-light-preview .mode svg{width:18px!important;height:18px!important}
#custom-light-preview .mode:disabled{opacity:.35}
#custom-light-preview .socket-card .status{color:#b0b7be}
@media(max-width:440px){#custom-light-preview .preview{padding:23px 12px}#custom-light-preview .light-card{padding:10px 10px 13px}#custom-light-preview .head{gap:9px}#custom-light-preview .name{font-size:14px;line-height:18px}#custom-light-preview .status{font-size:11px}#custom-light-preview .controls{grid-template-columns:minmax(0,1fr);gap:7px}#custom-light-preview .modes{justify-self:end}#custom-light-preview .switch{width:104px}#custom-light-preview .knob-position{transform:translateX(48px)}#custom-light-preview .track-value{width:48px}#custom-light-preview .switch[aria-checked="false"] .track-value{transform:translateX(56px)}}
@media(prefers-reduced-motion:reduce){#custom-light-preview *,#custom-light-preview *:before,#custom-light-preview *:after{animation:none!important;transition:none!important}}
</style>
<div id="custom-light-preview" class="viz-dotted-background">
 <div class="preview">
  <section class="light-card" data-on="true" aria-label="Custom-Light-Card · dunkles flaches Glas">
   <div class="uplight"></div>
   <div class="head">
    <button type="button" class="switch cursor-interaction" role="switch" aria-checked="true" aria-label="Wohnzimmer Ambiente"><span class="track"><span class="track-light"></span></span><span class="track-value">72%</span><span class="knob-position"><span class="knob"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18v-2.5a6.5 6.5 0 1 1 6 0V18M9 18h6M9.5 21h5"/></svg></span></span></button>
    <div><div class="name">Wohnzimmer Ambiente</div><div class="status">72 % · Farbton 265°</div></div>
   </div>
   <div class="controls"><input type="range" min="1" max="100" value="72" aria-label="Helligkeit"><div class="modes" aria-label="Lichtfunktion"><button type="button" class="mode cursor-interaction" data-mode="brightness" aria-label="Helligkeit" aria-pressed="true"><i data-lucide="sun" aria-hidden="true"></i></button><button type="button" class="mode cursor-interaction" data-mode="temperature" aria-label="Farbtemperatur" aria-pressed="false"><i data-lucide="thermometer" aria-hidden="true"></i></button><button type="button" class="mode cursor-interaction" data-mode="color" aria-label="Lichtfarbe" aria-pressed="false"><i data-lucide="palette" aria-hidden="true"></i></button></div></div>
  </section>
  <section class="light-card socket-card" data-on="true" aria-label="Steckdose · gelb ohne Farbfunktion" style="--light:#ffd45b;--level:1">
   <div class="uplight"></div>
   <div class="head"><button type="button" class="switch cursor-interaction" role="switch" aria-checked="true" aria-label="Büro Eingang"><span class="track"><span class="track-light"></span></span><span class="track-value">Ein</span><span class="knob-position"><span class="knob"><svg class="socket" viewBox="0 0 24 24" aria-hidden="true"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M10,12A1.5,1.5 0 0,0 8.5,10.5A1.5,1.5 0 0,0 7,12A1.5,1.5 0 0,0 8.5,13.5A1.5,1.5 0 0,0 10,12M17,12A1.5,1.5 0 0,0 15.5,10.5A1.5,1.5 0 0,0 14,12A1.5,1.5 0 0,0 15.5,13.5A1.5,1.5 0 0,0 17,12M11,5V8H13V5M11,16V19H13V16"/></svg></span></span></button><div><div class="name">Büro Eingang</div><div class="status">Ein · Gelb</div></div></div>
  </section>
 </div>
</div>
<script>
(()=>{
 const root=document.getElementById('custom-light-preview'),card=root.querySelector('.light-card'),socket=root.querySelector('.socket-card'),input=card.querySelector('input');
 const state={on:true,brightness:72,hue:265,temperature:3000,colorMode:'color',mode:'brightness',socketOn:true};
 const saved=window.demoState?.widgetState?.privateContent?.customLight;
 if(saved)for(const key of Object.keys(state))if(typeof saved[key]===typeof state[key])state[key]=saved[key];
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 function render(){const color=state.colorMode==='temperature'?'hsl(39 100% '+(68+(state.temperature-2000)/4500*25)+'%)':'hsl('+state.hue+' 90% 70%)';card.style.setProperty('--light',color);card.style.setProperty('--level',state.on?state.brightness/100:0);card.dataset.on=String(state.on);card.querySelector('.switch').setAttribute('aria-checked',String(state.on));card.querySelector('.track-value').textContent=state.on?state.brightness+'%':'Aus';card.querySelector('.status').textContent=state.on?state.brightness+' % · '+(state.colorMode==='temperature'?state.temperature+' K':'Farbton '+state.hue+'°'):'Aus';
  input.min=state.mode==='temperature'?2000:state.mode==='color'?0:1;input.max=state.mode==='temperature'?6500:state.mode==='color'?360:100;input.value=state.mode==='temperature'?state.temperature:state.mode==='color'?state.hue:state.brightness;
  input.setAttribute('aria-label',state.mode==='temperature'?'Farbtemperatur':state.mode==='color'?'Lichtfarbe':'Helligkeit');input.setAttribute('aria-valuetext',input.value+(state.mode==='temperature'?' Kelvin':state.mode==='color'?' Grad':' Prozent'));
  const bg=state.mode==='temperature'?'linear-gradient(90deg,#ffae50,#fff0d1,#c1d8ff)':state.mode==='color'?'linear-gradient(90deg,#e86767,#dcc968,#8ddb72,#74dba7,#73bedb,#9374db,#dd74d0,#e86767)':'linear-gradient(90deg,#292d31,'+color+')';input.style.setProperty('--slider',bg);
  card.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',String(state.mode===b.dataset.mode)));
  socket.dataset.on=String(state.socketOn);socket.style.setProperty('--level',state.socketOn?1:0);socket.querySelector('.switch').setAttribute('aria-checked',String(state.socketOn));socket.querySelector('.track-value').textContent=state.socketOn?'Ein':'Aus';socket.querySelector('.status').textContent=state.socketOn?'Ein · Gelb':'Aus';
 }
 function persist(){window.demoState?.setWidgetState?.({modelContent:{design:'Custom-Light-Card · flaches dunkles Glas mit elastischem Icon-Schalter',...state},privateContent:{customLight:{...state}}})?.catch(()=>{});}
 root.querySelectorAll('.switch').forEach(button=>{let busy=false;button.addEventListener('click',()=>{if(busy)return;busy=true;button.classList.add('pressing');setTimeout(()=>{button.classList.remove('pressing');button.classList.add('travelling');if(button.closest('.socket-card'))state.socketOn=!state.socketOn;else state.on=!state.on;render();persist();setTimeout(()=>{button.classList.remove('travelling');busy=false;},reduced?0:670);},reduced?0:100);});});
 card.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{state.mode=b.dataset.mode;render();persist();}));
 input.addEventListener('input',()=>{if(state.mode==='color'){state.hue=Number(input.value);state.colorMode='color';}else if(state.mode==='temperature'){state.temperature=Number(input.value);state.colorMode='temperature';}else state.brightness=Number(input.value);state.on=true;render();});input.addEventListener('change',persist);
 render();
 if(globalThis.Tweak){const design={radius:18};const tweak=new Tweak({container:card,onChange:()=>{card.style.borderRadius=design.radius+'px';}});tweak.addSlider(design,'radius',{label:'Kartenkante',min:12,max:24,unit:'px'});}
 window.addEventListener('demo:state',e=>{const s=e.detail?.globals?.widgetState?.privateContent?.customLight;if(s){for(const key of Object.keys(state))if(typeof s[key]===typeof state[key])state[key]=s[key];render();}});
})();
</script>
