<style>
#frost-light{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f1f1f2;color-scheme:dark}
#frost-light *{box-sizing:border-box}
#frost-light .fl-scene{position:relative;isolation:isolate;overflow:hidden;border-radius:24px;padding:64px 34px 76px;background:radial-gradient(ellipse at 18% 8%,#303534 0,transparent 55%),radial-gradient(ellipse at 90% 85%,#20262b,transparent 55%),#101214;display:flex;justify-content:center;--light:#cdb4ff;--power:.72;--wash:.38}
#frost-light .fl-scene:before{content:"";position:absolute;width:200px;height:560px;top:-180px;left:-10px;background:linear-gradient(90deg,transparent,#aabbb713,transparent);filter:blur(18px);transform:rotate(32deg);z-index:-2;pointer-events:none}
#frost-light .fl-scene:after{content:"";position:absolute;width:90%;height:1px;bottom:43px;background:linear-gradient(90deg,transparent,#ffffff0b,transparent);z-index:-2}
#frost-light .fl-wrap{position:relative;width:min(100%,430px);isolation:isolate}
#frost-light .fl-floor{position:absolute;left:12%;right:12%;bottom:-17px;height:51px;border-radius:50%;background-color:var(--light);opacity:calc(var(--power)*.27);filter:blur(26px);z-index:-1;transition:background-color .45s,opacity .65s,transform .8s;transform:scaleX(calc(.65 + var(--power)*.4))}
#frost-light .fl-card{position:relative;isolation:isolate;overflow:hidden;border-radius:28px;padding:26px 28px 30px;background:linear-gradient(145deg,#ffffff0c,transparent 55%),#090b0dd6;backdrop-filter:blur(32px) saturate(75%);-webkit-backdrop-filter:blur(32px) saturate(75%);border:1px solid #ffffff18;box-shadow:inset 0 1px 0 #ffffff10,0 25px 50px #00000040;--curve:28px}
#frost-light .fl-uplight{position:absolute;inset:15% -10% -4%;background-color:var(--light);mask-image:radial-gradient(ellipse 70% 67% at 50% 112%,#000 0%,#000c 25%,#0005 54%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse 70% 67% at 50% 112%,#000 0%,#000c 25%,#0005 54%,transparent 80%);opacity:var(--wash);z-index:-1;pointer-events:none;transition:background-color .45s,opacity .65s}
#frost-light .fl-horizon{position:absolute;left:16%;right:16%;bottom:0;height:2px;background-color:var(--light);box-shadow:0 -2px 13px var(--light);opacity:var(--power);mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent);pointer-events:none;transition:background-color .45s,box-shadow .45s,opacity .65s}
#frost-light .fl-noise{position:absolute;inset:0;width:100%;height:100%;opacity:.11;mix-blend-mode:soft-light;pointer-events:none;z-index:0}
#frost-light .fl-content{position:relative;z-index:1}
#frost-light .fl-header{display:flex;align-items:center;gap:12px}
#frost-light .fl-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:13px;border:1px solid #ffffff14;background:#ffffff05;color:#dfe1e3;flex:none;transition:color .45s,background .45s}
#frost-light .fl-icon svg{width:19px!important;height:19px!important;stroke-width:1.6}
#frost-light [data-on="true"] .fl-icon{color:var(--light);background:color-mix(in srgb,var(--light) 8%,transparent)}
#frost-light .fl-title{font-size:16px;line-height:22px;letter-spacing:-.3px;font-weight:500}
#frost-light .fl-room{font-size:11px;line-height:17px;color:#93999f}
#frost-light .fl-toggle{position:relative;margin-left:auto;flex:none;width:57px;height:44px;border:0;padding:0;background:transparent;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#frost-light .fl-toggle-track{position:absolute;left:0;right:0;top:7px;height:30px;border-radius:20px;background:#ffffff12;box-shadow:inset 0 0 0 1px #ffffff0b;transition:background .45s}
#frost-light .fl-toggle-knob{position:absolute;width:22px;height:22px;left:4px;top:11px;border-radius:50%;background:#93979e;box-shadow:0 1px 4px #00000030;transition:transform .42s cubic-bezier(.2,1.25,.4,1),background .35s}
#frost-light .fl-toggle[aria-checked="true"] .fl-toggle-track{background:color-mix(in srgb,var(--light) 25%,#141618)}
#frost-light .fl-toggle[aria-checked="true"] .fl-toggle-knob{transform:translateX(27px);background:#f0f0f1}
#frost-light .fl-toggle:active .fl-toggle-knob{scale:.92}
#frost-light .fl-reading{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:34px;margin-bottom:18px}
#frost-light .fl-number{display:flex;align-items:baseline;gap:5px;color:#f0f1f3;font-size:54px;line-height:1;letter-spacing:-2.5px;font-weight:400;font-variant-numeric:tabular-nums}
#frost-light .fl-number small{font-size:23px;color:#82888f;letter-spacing:-.5px}
#frost-light .fl-caption{margin-top:8px;font-size:11px;color:#9da2a9;line-height:16px}
#frost-light .fl-status{display:flex;align-items:center;gap:6px;color:#c8cbd0;font-size:11px;line-height:16px;margin-bottom:2px;white-space:nowrap}
#frost-light .fl-status:before{content:"";width:5px;height:5px;border-radius:50%;background:#747980;transition:background .4s}
#frost-light [data-on="true"] .fl-status:before{background:var(--light)}
#frost-light .fl-slider{height:40px;position:relative;display:flex;align-items:center;--fill:72%}
#frost-light .fl-track{position:absolute;height:6px;left:0;right:0;border-radius:20px;background:#ffffff12;overflow:hidden}
#frost-light .fl-fill{height:100%;width:var(--fill);border-radius:inherit;background-color:var(--light);opacity:.9;transition:background-color .45s,opacity .45s}
#frost-light input[type="range"]{appearance:none;-webkit-appearance:none;width:100%;height:40px;background:transparent;position:relative;margin:0;z-index:1;touch-action:pan-y}
#frost-light input[type="range"]::-webkit-slider-runnable-track{height:6px;background:transparent}
#frost-light input[type="range"]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin-top:-6px;border-radius:50%;background:#f2f2f3;border:0;box-shadow:0 1px 5px #00000040;transition:transform .2s}
#frost-light input[type="range"]::-moz-range-track{height:6px;background:transparent}
#frost-light input[type="range"]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#f2f2f3;border:0}
#frost-light input[type="range"]:active::-webkit-slider-thumb{transform:scale(1.16)}
#frost-light .fl-color-head{display:flex;align-items:center;justify-content:space-between;font-size:11px;line-height:18px;margin-top:24px;color:#acb1b8}
#frost-light .fl-color-value{display:flex;align-items:center;gap:7px;color:#e1e3e6}
#frost-light .fl-swatch{width:8px;height:8px;flex:none;border-radius:50%;background:var(--light);transition:background .45s}
#frost-light .fl-hue .fl-track{height:5px;background:linear-gradient(90deg,#f19c9c,#eacf9e,#b5df9d,#9cdec0,#9dccdf,#b09cde,#dd9ce0,#f19c9c);opacity:.72}
#frost-light .fl-hue input[type="range"]::-webkit-slider-runnable-track{height:5px}
#frost-light .fl-hue input[type="range"]::-webkit-slider-thumb{width:15px;height:15px;margin-top:-5px;background:var(--light);box-shadow:0 0 0 2px #111419,0 0 0 3px #ffffffa0;transition:background .45s,transform .2s}
#frost-light .fl-hue input[type="range"]::-moz-range-thumb{width:15px;height:15px;background:var(--light);box-shadow:0 0 0 2px #111419,0 0 0 3px #ffffffa0}
#frost-light .fl-presets{display:flex;justify-content:center;gap:9px;margin-top:17px}
#frost-light .fl-preset{width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:50%;padding:0;-webkit-tap-highlight-color:transparent}
#frost-light .fl-preset span{display:block;width:16px;height:16px;border-radius:50%;background:var(--preset);box-shadow:0 0 0 0 #ffffff00;transition:transform .25s,box-shadow .25s}
#frost-light .fl-preset[aria-pressed="true"] span{box-shadow:0 0 0 4px #151718,0 0 0 5px #ffffff8a}
#frost-light .fl-preset:active span{transform:scale(.85)}
@media(max-width:430px){#frost-light .fl-scene{padding:35px 14px 48px}#frost-light .fl-card{padding:23px 22px 25px;border-radius:24px}#frost-light .fl-reading{margin-top:31px}#frost-light .fl-number{font-size:49px}#frost-light .fl-title{font-size:15px}#frost-light .fl-header{gap:10px}#frost-light .fl-presets{gap:4px}#frost-light .fl-icon{width:34px;height:34px}#frost-light .fl-toggle{width:53px}#frost-light .fl-toggle[aria-checked="true"] .fl-toggle-knob{transform:translateX(23px)}}
@media(prefers-reduced-motion:reduce){#frost-light *,#frost-light *:before,#frost-light *:after{transition:none!important;animation:none!important}}
</style>
<div id="frost-light" class="viz-dotted-background">
 <div class="fl-scene">
  <div class="fl-wrap">
   <div class="fl-floor" aria-hidden="true"></div>
   <section class="fl-card" data-on="true" aria-label="Stehlampe · schwarzes Frostglas">
    <div class="fl-uplight" aria-hidden="true"></div><div class="fl-horizon" aria-hidden="true"></div><canvas class="fl-noise" aria-hidden="true"></canvas>
    <div class="fl-content">
     <div class="fl-header"><span class="fl-icon"><i data-lucide="lamp-floor" aria-hidden="true"></i></span><div><div class="fl-title">Stehlampe</div><div class="fl-room">Wohnzimmer</div></div><button type="button" class="fl-toggle cursor-interaction" role="switch" aria-checked="true" aria-label="Stehlampe"><span class="fl-toggle-track"></span><span class="fl-toggle-knob"></span></button></div>
     <div class="fl-reading"><div><output class="fl-number" for="frost-bright"><span>72</span><small>%</small></output><label class="fl-caption" for="frost-bright">Helligkeit</label></div><span class="fl-status" aria-live="polite">Eingeschaltet</span></div>
     <div class="fl-slider fl-bright"><div class="fl-track"><div class="fl-fill"></div></div><input type="range" id="frost-bright" min="1" max="100" value="72" aria-label="Helligkeit"></div>
     <div class="fl-color-head"><label for="frost-hue">Lichtfarbe</label><output for="frost-hue" class="fl-color-value"><span class="fl-swatch" aria-hidden="true"></span><span class="fl-color-name">Lavendel</span></output></div>
     <div class="fl-slider fl-hue"><div class="fl-track"></div><input type="range" id="frost-hue" min="0" max="360" value="265" aria-label="Lichtfarbe"></div>
     <div class="fl-presets" aria-label="Farbvorschläge">
      <button type="button" class="fl-preset cursor-interaction" data-hue="35" aria-label="Champagner" aria-pressed="false" style="--preset:#eac99b"><span></span></button>
      <button type="button" class="fl-preset cursor-interaction" data-hue="155" aria-label="Mint" aria-pressed="false" style="--preset:#a0e2c6"><span></span></button>
      <button type="button" class="fl-preset cursor-interaction" data-hue="210" aria-label="Eisblau" aria-pressed="false" style="--preset:#a0c2e2"><span></span></button>
      <button type="button" class="fl-preset cursor-interaction" data-hue="265" aria-label="Lavendel" aria-pressed="true" style="--preset:#bba0e2"><span></span></button>
      <button type="button" class="fl-preset cursor-interaction" data-hue="330" aria-label="Rosé" aria-pressed="false" style="--preset:#e2a0c1"><span></span></button>
     </div>
    </div>
   </section>
  </div>
 </div>
</div>
<script>
(()=>{
 const root=document.getElementById('frost-light'),scene=root.querySelector('.fl-scene'),card=root.querySelector('.fl-card'),toggle=root.querySelector('.fl-toggle'),bright=root.querySelector('#frost-bright'),hue=root.querySelector('#frost-hue');
 const state={on:true,brightness:72,hue:265};
 const design={glow:1,frost:32};
 function applySaved(data){if(!data)return;if(typeof data.on==='boolean')state.on=data.on;if(Number.isFinite(data.brightness))state.brightness=Math.max(1,Math.min(100,data.brightness));if(Number.isFinite(data.hue))state.hue=Math.max(0,Math.min(360,data.hue));}
 applySaved(window.demoState?.widgetState?.privateContent?.frostLight);
 function name(h){return h<18||h>=348?'Koralle':h<55?'Champagner':h<82?'Honig':h<140?'Salbei':h<180?'Mint':h<235?'Eisblau':h<290?'Lavendel':'Rosé';}
 function render(){
  const color='hsl('+state.hue+' 62% 76%)',power=state.on?state.brightness/100:0;
  scene.style.setProperty('--light',color);scene.style.setProperty('--power',String(power));scene.style.setProperty('--wash',String(Math.min(.82,power*.62*design.glow)));
  card.dataset.on=String(state.on);toggle.setAttribute('aria-checked',String(state.on));
  root.querySelector('.fl-number span').textContent=String(state.on?state.brightness:0);
  root.querySelector('.fl-status').textContent=state.on?'Eingeschaltet':'Aus';
  root.querySelector('.fl-caption').textContent=state.on?'Helligkeit':state.brightness+' % gespeichert';
  root.querySelector('.fl-bright').style.setProperty('--fill',state.brightness+'%');
  root.querySelector('.fl-fill').style.opacity=state.on?'.9':'.25';
  bright.value=state.brightness;hue.value=state.hue;
  bright.setAttribute('aria-valuetext',state.brightness+' Prozent');hue.setAttribute('aria-valuetext',name(state.hue));
  root.querySelector('.fl-color-name').textContent=name(state.hue);
  root.querySelectorAll('.fl-preset').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.hue)===state.hue)));
  card.style.backdropFilter='blur('+design.frost+'px) saturate(75%)';card.style.webkitBackdropFilter=card.style.backdropFilter;
 }
 function persist(){window.demoState?.setWidgetState?.({modelContent:{design:'Schwarzes Frostglas mit Licht von unten',...state},privateContent:{frostLight:{...state}}})?.catch(()=>{});}
 toggle.addEventListener('click',()=>{state.on=!state.on;render();persist();});
 [[bright,'brightness'],[hue,'hue']].forEach(([input,key])=>{input.addEventListener('input',()=>{state[key]=Number(input.value);state.on=true;render();});input.addEventListener('change',persist);});
 root.querySelectorAll('.fl-preset').forEach(button=>button.addEventListener('click',()=>{state.hue=Number(button.dataset.hue);state.on=true;render();persist();}));
 const noise=root.querySelector('.fl-noise'),context=noise.getContext('2d');noise.width=430;noise.height=410;
 const pixels=context.createImageData(noise.width,noise.height);let seed=1259;for(let i=0;i<pixels.data.length;i+=4){seed=(seed*1664525+1013904223)>>>0;const v=seed>>>24;pixels.data[i]=pixels.data[i+1]=pixels.data[i+2]=v;pixels.data[i+3]=90;}context.putImageData(pixels,0,0);
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:card,onChange:render});tweak.addSlider(design,'glow',{label:'Leuchten von unten',min:.3,max:1.6,step:.1});tweak.addSlider(design,'frost',{label:'Frostglas',min:12,max:48,unit:'px'});}
 window.addEventListener('demo:state',event=>{const data=event.detail?.globals?.widgetState?.privateContent?.frostLight;if(data){applySaved(data);render();}});
})();
</script>
