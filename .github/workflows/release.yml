name: Publish complete HACS integration
on:
  push:
    tags: ['v3.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y libturbojpeg0
      - run: python -m pip install homeassistant==2026.9.0 PyTurboJPEG==1.8.3 av==17.0.1 numpy==2.3.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build:cards
      - run: python scripts/build-integration.py
      - run: ruby tests/check_theme.rb
      - run: python scripts/test-installer.py
      - run: python scripts/test-integration.py
      - run: python scripts/test-demo.py
      - run: node tests/demo-scope-browser.mjs
      - run: node tests/package-smoke.mjs
      - run: python scripts/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-release
          path: release/*
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: liquid-glass-release
          path: release
      - name: Publish validated integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/liquid_glass.zip release/SHA256SUMS.txt --verify-tag --title "DASH6 Satin Glass $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
