name: HACS integration validation
on:
  push:
    branches: [main]
    paths: ['custom_components/**', 'scripts/**', 'src/**', 'tests/**', 'package.json', 'package-lock.json', 'hacs.json', 'demo/**', 'frontend/**', 'themes/**', 'support/**', 'dependencies.lock.json', '.github/workflows/integration.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.9.0 PyTurboJPEG==1.8.3 av==17.0.1 numpy==2.3.2
      - run: python scripts/test-theme-store.py
      - run: python scripts/test-demo.py
      - run: python scripts/test-hue-dashboard.py
      - run: python scripts/test-integration.py
      - run: python scripts/test-installer.py

  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install Jinja2==3.1.6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build:cards
      - run: python scripts/build-integration.py
      - run: python scripts/build-public-demo.py
      - run: node tests/media-volume-browser.mjs
      - run: node tests/dash6-copy-browser.mjs
      - run: node tests/demo-content-scope-browser.mjs
      - run: node tests/public-showcase-browser.mjs
      - run: node tests/theme-save-actions-browser.mjs
      - run: node tests/demo-runtime.mjs
      - run: node tests/demo-scope-browser.mjs
      - run: node tests/demo-favorites.mjs
      - run: node tests/demo-favorites-browser.mjs
      - run: node tests/theme-classes-browser.mjs
      - run: node tests/domain-registry.mjs
      - run: node tests/domain-thin-shell.mjs
      - run: node tests/domain-scene-grid.mjs
      - run: node tests/domain-editor-browser.mjs
      - run: node tests/media-edit-controls-browser.mjs
      - run: node tests/favorites-selection.mjs
      - run: node tests/favorites-manual-order.mjs
      - run: node tests/favorites-manual-order-browser.mjs
      - run: node tests/favorites-inline-browser.mjs
      - run: node tests/profiles-store.mjs
      - run: node tests/native-hook-registry.mjs
      - run: node tests/inline-query.mjs
        env:
          DASH6_JINJA_PYTHON: python
      - run: node tests/inline-runtime-browser.mjs
      - run: node tests/inline-domain-browser.mjs
      - run: node tests/navigation-lens-browser.mjs
      - run: node tests/native-dashboard-navigation-browser.mjs
      - run: node tests/sections-width-browser.mjs
      - run: node tests/sections-responsive-browser.mjs
      - run: node tests/sections-responsive-browser.mjs
        env:
          DASH6_TEST_BROWSER: webkit
      - run: node tests/room-slot-grid-browser.mjs
      - run: node tests/light-surface-first-render-browser.mjs
      - run: node tests/glass-switch-motion-browser.mjs
      - run: node tests/fan-mode-refinements.mjs
      - run: node tests/fan-mode-switch-browser.mjs
      - run: node tests/fan-card-browser.mjs
      - run: node tests/fan-shelly-countdown-browser.mjs
      - run: node tests/fan-power-feedback-browser.mjs
      - run: node tests/shoe-scene-background-browser.mjs
      - run: node tests/responsive-layouts-browser.mjs
      - run: node tests/favorites-masonry-browser.mjs
      - run: node tests/native-switch-lifecycle-browser.mjs
      - run: node tests/native-switch-wrapper-browser.mjs
      - run: node tests/package-smoke.mjs
