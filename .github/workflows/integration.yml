name: HACS integration validation
on:
  push:
    branches: [main]
    paths: ['custom_components/**', 'scripts/test-integration.py', 'scripts/test-installer.py', 'src/**', 'tests/**', 'package.json', 'package-lock.json', 'hacs.json', '.github/workflows/integration.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.9.0
      - run: python scripts/test-integration.py
      - run: python scripts/test-installer.py

  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/favorites-selection.mjs
      - run: node tests/profiles-store.mjs
      - run: node tests/navigation-lens-browser.mjs
      - run: node tests/sections-width-browser.mjs
      - run: node tests/sections-responsive-browser.mjs
      - run: node tests/room-slot-grid-browser.mjs
      - run: node tests/light-surface-first-render-browser.mjs
      - run: node tests/glass-switch-motion-browser.mjs
      - run: node tests/responsive-layouts-browser.mjs
      - run: node tests/favorites-masonry-browser.mjs
      - run: node tests/native-switch-lifecycle-browser.mjs
      - run: node tests/native-switch-wrapper-browser.mjs
      - run: node tests/package-smoke.mjs
