name: HACS integration validation
on:
  push:
    branches: [main]
    paths: ['custom_components/**', 'scripts/test-integration.py', 'hacs.json', '.github/workflows/integration.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.9.0
      - run: python scripts/test-integration.py
      - run: python scripts/test-installer.py
