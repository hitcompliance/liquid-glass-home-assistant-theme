name: Interactive card demos
on:
  push:
    branches: [main]
    paths: ['demo/**', 'README.md', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Refresh README for the gallery
        run: cp README.md demo/README.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: demo
      - name: Publish gallery
        id: deployment
        uses: actions/deploy-pages@v4
